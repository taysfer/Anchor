<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Anchor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <div class="app__logo">&#9875;</div>
        <div class="app__name">Anchor</div>
      </header>

      <section id="view-start" class="view">
        <label class="field-label" for="goal-input">What are you here to do?</label>
        <textarea id="goal-input" rows="3" placeholder="e.g. Learn how Kubernetes ingress works"></textarea>
        <button id="start-btn" class="btn btn--primary">Start session</button>
      </section>

      <section id="view-active" class="view" hidden>
        <div class="goal-card">
          <div class="goal-card__label">Your goal</div>
          <div class="goal-card__text" id="active-goal"></div>
        </div>
        <div class="status-row">
          <div class="status-pill" id="status-pill">&mdash;</div>
          <div class="status-time" id="status-time">00:00</div>
        </div>
        <div class="events">
          <div class="events__title">Recent pages</div>
          <ul id="events-list" class="events__list"></ul>
        </div>
        <button id="end-btn" class="btn btn--secondary">End session</button>
      </section>

      <section id="view-summary" class="view" hidden>
        <div class="summary__title">Session summary</div>
        <div class="summary__goal" id="summary-goal"></div>
        <div class="summary__stats" id="summary-stats"></div>
        <div class="events">
          <div class="events__title">Timeline</div>
          <ul id="summary-events" class="events__list"></ul>
        </div>
        <button id="new-session-btn" class="btn btn--primary">Start new session</button>
      </section>
    </div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
