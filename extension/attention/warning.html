<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Still with us?</title>
    <link rel="stylesheet" href="warning.css" />
  </head>
  <body>
    <main class="warning" id="warning">
      <div class="warning__title" id="warning-title">Still with us?</div>
      <div class="warning__text" id="warning-text">You looked away from your screen.</div>
      <div class="warning__timer" id="warning-timer">Away for 0:00</div>
      <div class="warning__goal">
        <span class="warning__goal-label">Your goal</span>
        <span id="warning-goal"></span>
      </div>
      <button id="warning-dismiss" class="warning__button">I'm back</button>
    </main>

    <script src="../shared.js"></script>
    <script src="warning.js"></script>
  </body>
</html>
